[project]
name = "expense-mcp"
version = "0.1.0"
description = "FastMCP expense server backed by Supabase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0.0",
  "supabase>=2.8.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
expense-mcp = "expense_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
